<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How ObserveTrack works</title>
<desc id="desc">Incomplete collection is not a no change result. Report missing coverage and limitations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="780" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#0f172a">
<text x="560" y="42" font-size="25" font-weight="700">How ObserveTrack works</text>
<rect x="310" y="65" width="500" height="54" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="560.0" y="98.0" font-size="17">Manual check / Scheduled job</text>
<path d="M560 119 V143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="145" width="500" height="54" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="560.0" y="178.0" font-size="17">Read only GitHub collection</text>
<path d="M560 199 V223" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="225" width="680" height="62" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="560.0" y="262.0" font-size="17">Save baselines, cursors, evidence, and content versions</text>
<path d="M560 287 V318 H147.5 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="350" width="235" height="126" rx="12" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="147.5" y="393.0" font-size="17">Content changed</text>
<text x="147.5" y="419.0" font-size="17">Factual brief /</text>
<text x="147.5" y="445.0" font-size="17">Optional model analysis</text>
<path d="M147.5 476 V516 H560 V546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 287 V318 H422.5 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="350" width="235" height="126" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="422.5" y="393.0" font-size="17">Metrics only</text>
<text x="422.5" y="419.0" font-size="17">Update metrics and charts</text>
<text x="422.5" y="445.0" font-size="17">Skip model</text>
<path d="M422.5 476 V516 H560 V546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 287 V318 H697.5 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="350" width="235" height="126" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="697.5" y="393.0" font-size="17">Complete check, no changes</text>
<text x="697.5" y="419.0" font-size="17">Record no changes</text>
<text x="697.5" y="445.0" font-size="17">Skip model</text>
<path d="M697.5 476 V516 H560 V546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 287 V318 H972.5 V348" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="350" width="235" height="126" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="972.5" y="393.0" font-size="17">Missing pages or failures</text>
<text x="972.5" y="419.0" font-size="17">Record incomplete coverage</text>
<text x="972.5" y="445.0" font-size="17">and reasons</text>
<path d="M972.5 476 V516 H560 V546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140" y="548" width="840" height="84" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="560.0" y="583.0" font-size="17">Save run results and coverage</text>
<text x="560.0" y="609.0" font-size="17">Build daily / weekly reports from available material; retain sources and versions</text>
<path d="M560 632 V656" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="658" width="680" height="56" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="560.0" y="692.0" font-size="17">Web reader / Evidence / Charts / Exports</text>
<text x="560" y="752" font-size="16" fill="#475569">Incomplete collection is not a no change result. Report missing coverage and limitations.</text></g></svg>
