<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">ObserveTrack 工作原理</title>
<desc id="desc">采集不完整不等于没有变化；报告保留缺失范围与限制。</desc>
